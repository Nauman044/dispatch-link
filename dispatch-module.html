<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dispatch Link – Dispatch Management</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#1b2438;--mut:#6b7691;--line:#e3e8f1;--pri:#1f5eff;--ok:#12a150;--warn:#d98a00;--bad:#d83a3a}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{background:#0f1a33;color:#fff;padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header h1{font-size:18px;margin:0;flex:1}header h1 span{color:#7ea3ff}
nav{display:flex;gap:4px;flex-wrap:wrap}nav button{background:none;border:0;color:#b9c5e3;padding:8px 14px;border-radius:6px;cursor:pointer;font:inherit}
nav button.on{background:var(--pri);color:#fff}
#sync{font-size:12px;padding:3px 10px;border-radius:99px;background:#26325a}
main{max-width:1200px;margin:20px auto;padding:0 16px}
.tab{display:none}.tab.on{display:block}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.kpi b{display:block;font-size:24px;margin-top:4px}.kpi small{color:var(--mut)}
h2{font-size:16px;margin:0 0 12px}
.bar{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}.bar h2{margin:0;flex:1}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.03em}
.r{text-align:right}
button.b{background:var(--pri);color:#fff;border:0;padding:8px 14px;border-radius:6px;cursor:pointer;font:inherit}
button.g{background:#eef2fb;color:var(--ink)}button.x{background:none;color:var(--bad);border:0;cursor:pointer}
input,select{font:inherit;padding:8px;border:1px solid var(--line);border-radius:6px;width:100%;background:#fff}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:10px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
dialog{border:0;border-radius:12px;padding:20px;width:min(560px,94vw)}dialog::backdrop{background:#0008}
.pill{padding:2px 9px;border-radius:99px;font-size:12px;background:#eef2fb}
.Delivered{background:#dff5e8;color:var(--ok)}.Booked{background:#e3ecff;color:var(--pri)}
.In\ Transit{background:#fff1d6;color:var(--warn)}.Cancelled{background:#fde4e4;color:var(--bad)}
#inv{background:#fff;border:1px solid var(--line);padding:32px;margin-top:16px;max-width:820px}
#inv .top{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
#inv h3{margin:0;font-size:22px}.tot{margin-left:auto;width:280px;margin-top:14px}
.tot div{display:flex;justify-content:space-between;padding:4px 0}.tot .due{font-weight:700;font-size:17px;border-top:2px solid var(--ink)}
@media(max-width:600px){.f2{grid-template-columns:1fr}}
@media print{body{background:#fff}header,nav,.noprint,.tab:not(#t-inv){display:none!important}#inv{border:0;padding:0;margin:0;max-width:none}main{margin:0}}
</style></head><body>
<header><h1><span>Dispatch</span> Link · Dispatch Management</h1>
<nav id="nav"></nav><span id="sync">Local only</span></header>
<main>
<section class="tab on" id="t-dash">
 <div class="grid" id="kpis"></div>
 <div class="card"><h2>Dispatcher performance</h2><div class="tw"><table id="dtab"></table></div></div>
</section>
<section class="tab" id="t-car"><div class="card">
 <div class="bar"><h2>Carriers</h2><input id="cq" placeholder="Search…" style="max-width:220px"><button class="b" onclick="editCarrier()">+ Add carrier</button></div>
 <div class="tw"><table id="ctab"></table></div></div></section>
<section class="tab" id="t-load"><div class="card">
 <div class="bar"><h2>Loads</h2><select id="lf" style="max-width:200px" onchange="renderLoads()"></select><button class="b" onclick="editLoad()">+ Log load</button></div>
 <div class="tw"><table id="ltab"></table></div></div></section>
<section class="tab" id="t-inv"><div class="card noprint">
 <h2>Carrier invoice</h2>
 <div class="f2"><label>Carrier<select id="ic"></select></label><span></span>
 <label>From<input type="date" id="if"></label><label>To<input type="date" id="it"></label></div>
 <div id="iloads" class="tw"></div>
 <p><button class="b" onclick="genInvoice()">Generate invoice</button> <button class="b g" onclick="window.print()">Print / Save PDF</button></p></div>
 <div id="inv" hidden></div></section>
<section class="tab" id="t-set"><div class="card" style="max-width:640px"><h2>Settings</h2>
 <label>Company name (invoice branding)<input id="s-name"></label>
 <label>Company address / email / phone (one line)<input id="s-addr"></label>
 <label>Payment instructions<input id="s-pay" placeholder="e.g. ACH / Zelle details"></label>
 <label>Dispatchers (comma separated)<input id="s-disp" placeholder="Alex, Sam, Priya"></label>
 <label>Default commission %<input id="s-pct" type="number" step="0.1"></label>
 <label>Google Apps Script Web App URL<input id="s-url" placeholder="https://script.google.com/macros/s/…/exec"></label>
 <label>Shared secret token<input id="s-tok"></label>
 <button class="b" onclick="saveCfg()">Save &amp; sync</button></div></section>
</main>

<dialog id="dc"><h2>Carrier</h2><form method="dialog" onsubmit="return false">
 <div class="f2"><label>MC / MX number *<input id="c-mc" required></label>
 <label>Company name *<input id="c-company" required></label>
 <label>Carrier name *<input id="c-owner" required></label>
 <label>Phone *<input id="c-phone" type="tel" required></label>
 <label>Truck type *<select id="c-truck"><option>Dry Van</option><option>Reefer</option><option>Flatbed</option><option>Power Only</option><option>Step Deck</option><option>Box Truck</option></select></label>
 <label>Dispatcher (baad me bhi add ho sakta hai)<input id="c-dispatcher" list="dl"></label>
 <label>Commission %<input id="c-commission" type="number" step="0.1" min="0" max="100"></label>
 <label>Status<select id="c-status"><option>Active</option><option>Inactive</option></select></label></div>
 <datalist id="dl"></datalist>
 <button class="b" onclick="saveCarrier()">Save</button> <button class="b g" onclick="dc.close()">Cancel</button></form></dialog>

<dialog id="dlg"><h2>Load</h2><form method="dialog" onsubmit="return false">
 <div class="f2"><label>Carrier *<select id="l-carrierId" onchange="carPct()"></select></label>
 <label>Booking date &amp; time *<input id="l-booked" type="datetime-local"></label>
 <label>Status<select id="l-status"><option>Booked</option><option>In Transit</option><option>Delivered</option><option>Cancelled</option></select></label>
 <label>Rate con (USD) *<input id="l-rate" type="number" step="0.01" min="0"></label>
 <label>Commission %<input id="l-pct" type="number" step="0.1" min="0" max="100"></label>
 <label>Origin<input id="l-origin"></label><label>Destination<input id="l-dest"></label></div>
 <button class="b" onclick="saveLoad()">Save</button> <button class="b g" onclick="dlg.close()">Cancel</button></form></dialog>

<script>
/* ---------- state & helpers ---------- */
const $=s=>document.querySelector(s),uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $$=n=>'$'+(+n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch{return d}};
const st=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
let DB=ld('dl_db',{Carriers:[],Loads:[]}),DEFAULT_URL='https://script.google.com/macros/s/AKfycbzLChixOO3BD5X1mUpYEGKO71OQ1xS9GEGvdjQYARE3lnZLUI0WUspaxg-hJte7uuOo/exec',
DEFAULT_TOKEN='change-me-to-a-long-random-string', /* Code.gs wale TOKEN ke barabar rakhein */
CFG=Object.assign({name:'Your Dispatch Co.',pct:5},ld('dl_cfg',{}));
CFG.url=CFG.url||DEFAULT_URL;CFG.token=CFG.token||DEFAULT_TOKEN;
const cName=id=>(DB.Carriers.find(c=>c.id===id)||{}).company||'—';
const live=l=>l.status!=='Cancelled', fee=l=>(+l.rate||0)*(+l.pct||0)/100;
const persist=()=>st('dl_db',DB);

/* ---------- Google Sheets sync (Apps Script) ---------- */
function sync(t){$('#sync').textContent=t}
async function call(payload){
  if(!CFG.url)return;sync('Syncing…');
  try{const r=await fetch(CFG.url,{method:'POST',body:JSON.stringify({token:CFG.token,...payload})});
    const j=await r.json();if(j.error)throw j.error;sync('Synced '+new Date().toLocaleTimeString())}
  catch(e){sync('Sync error');console.error(e)}}
async function pull(){
  if(!CFG.url)return;sync('Syncing…');
  try{const r=await fetch(CFG.url+'?token='+encodeURIComponent(CFG.token||''));const j=await r.json();
    if(j.error)throw j.error;DB={Carriers:j.Carriers,Loads:j.Loads};persist();render();sync('Synced '+new Date().toLocaleTimeString())}
  catch(e){sync('Sync error');console.error(e)}}
function upsert(sheet,row){const a=DB[sheet],i=a.findIndex(x=>x.id===row.id);i<0?a.push(row):a[i]=row;persist();call({action:'upsert',sheet,row});render()}
function remove(sheet,id){if(!confirm('Delete this record?'))return;DB[sheet]=DB[sheet].filter(x=>x.id!==id);persist();call({action:'delete',sheet,id});render()}

/* ---------- date ranges ---------- */
function weekStart(){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d}
const monthStart=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),1)};
const inR=(l,from)=>new Date(l.booked)>=from;
const stats=ls=>({n:ls.length,gross:ls.reduce((s,l)=>s+(+l.rate||0),0),fee:ls.reduce((s,l)=>s+fee(l),0)});

/* ---------- render ---------- */
function render(){renderDash();renderCarriers();renderLoads();fillSelects()}
function renderDash(){
  const L=DB.Loads.filter(live),W=L.filter(l=>inR(l,weekStart())),M=L.filter(l=>inR(l,monthStart())),T=stats(L);
  const k=[['Active carriers',DB.Carriers.filter(c=>c.status!=='Inactive').length],['Loads this week',W.length],['Loads this month',M.length],
    ['Total gross revenue',$$(T.gross)],['Company earnings',$$(T.fee)]];
  $('#kpis').innerHTML=k.map(([a,b])=>`<div class="card kpi"><small>${a}</small><b>${b}</b></div>`).join('');
  const names=[...new Set([...DB.Carriers.map(c=>c.dispatcher),...L.map(l=>l.dispatcher)].filter(Boolean))];
  $('#dtab').innerHTML='<tr><th>Dispatcher</th><th class="r">Loads</th><th class="r">Gross</th><th class="r">Commission</th></tr>'+
   (names.map(n=>{const s=stats(L.filter(l=>l.dispatcher===n));return `<tr><td>${esc(n)}</td><td class="r">${s.n}</td><td class="r">${$$(s.gross)}</td><td class="r">${$$(s.fee)}</td></tr>`}).join('')||'<tr><td colspan=4>No data yet</td></tr>');
}
function renderCarriers(){
  const q=($('#cq').value||'').toLowerCase();
  $('#ctab').innerHTML='<tr><th>MC/MX</th><th>Company</th><th>Owner</th><th>Phone</th><th>Truck</th><th>Dispatcher</th><th class="r">Wk</th><th class="r">Mo</th><th class="r">Gross</th><th class="r">Earned</th><th></th></tr>'+
  DB.Carriers.filter(c=>JSON.stringify(c).toLowerCase().includes(q)).map(c=>{
    const L=DB.Loads.filter(l=>l.carrierId===c.id&&live(l)),s=stats(L);
    return `<tr><td>${esc(c.mc)}</td><td><b>${esc(c.company)}</b> ${c.status==='Inactive'?'<span class="pill">Inactive</span>':''}</td><td>${esc(c.owner)}</td><td>${esc(c.phone)}</td><td>${esc(c.truck)}</td><td>${esc(c.dispatcher)}</td>
    <td class="r">${L.filter(l=>inR(l,weekStart())).length}</td><td class="r">${L.filter(l=>inR(l,monthStart())).length}</td><td class="r">${$$(s.gross)}</td><td class="r">${$$(s.fee)}</td>
    <td><button class="b g" onclick="viewLoads('${c.id}')">Loads</button> <button class="b g" onclick="editCarrier('${c.id}')">Edit</button> <button class="x" onclick="remove('Carriers','${c.id}')">✕</button></td></tr>`}).join('');
}
function renderLoads(){
  const f=$('#lf').value;
  $('#ltab').innerHTML='<tr><th>Booked</th><th>Carrier</th><th>Route</th><th>Status</th><th class="r">Rate con</th><th class="r">%</th><th class="r">Earnings</th><th>Dispatcher</th><th></th></tr>'+
  DB.Loads.filter(l=>!f||l.carrierId===f).sort((a,b)=>b.booked.localeCompare(a.booked)).map(l=>
   `<tr><td>${esc(l.booked.replace('T',' '))}</td><td>${esc(cName(l.carrierId))}</td><td>${esc(l.origin)} → ${esc(l.dest)}</td><td><span class="pill ${l.status}">${l.status}</span></td>
   <td class="r">${$$(l.rate)}</td><td class="r">${l.pct}%</td><td class="r">${live(l)?$$(fee(l)):'—'}</td><td>${esc(l.dispatcher)}</td>
   <td><button class="b g" onclick="editLoad('${l.id}')">Edit</button> <button class="x" onclick="remove('Loads','${l.id}')">✕</button></td></tr>`).join('');
}
function fillSelects(){
  const opts=DB.Carriers.map(c=>`<option value="${c.id}">${esc(c.company)} (${esc(c.mc)})</option>`).join('');
  for(const id of['#l-carrierId','#ic']){const el=$(id),v=el.value;el.innerHTML=opts;el.value=v||el.options[0]?.value}
  const f=$('#lf'),v=f.value;f.innerHTML='<option value="">All carriers</option>'+opts;f.value=v;
  const ds=[...new Set([...(CFG.disp||'').split(',').map(s=>s.trim()),...DB.Carriers.map(c=>c.dispatcher)].filter(Boolean))];
  $('#dl').innerHTML=ds.map(d=>`<option value="${esc(d)}">`).join('');
}

/* ---------- carrier & load forms ---------- */
const CF=['mc','company','owner','phone','truck','dispatcher','commission','status'];
let eid=null;
function editCarrier(id){eid=id||null;const c=DB.Carriers.find(x=>x.id===id)||{commission:CFG.pct,status:'Active',truck:'Dry Van'};
  CF.forEach(k=>$('#c-'+k).value=c[k]??'');dc.showModal()}
function saveCarrier(){
  const r={id:eid||uid('c_')};CF.forEach(k=>r[k]=$('#c-'+k).value.trim());
  const req=['mc','company','owner','phone','truck'];
  if(req.some(k=>!r[k]))return alert('Please complete all mandatory fields.');
  r.commission=r.commission===''?CFG.pct:+r.commission;upsert('Carriers',r);dc.close()}
const LF=['carrierId','booked','status','rate','pct','origin','dest'];
function editLoad(id){eid=id||null;fillSelects();
  const l=DB.Loads.find(x=>x.id===id)||{booked:new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16),status:'Booked'};
  LF.forEach(k=>$('#l-'+k).value=l[k]??'');if(!id)carPct();dlg.showModal()}
function viewLoads(id){$('#lf').value=id;renderLoads();document.querySelector('[data-t=load]').click()}
function carPct(){const c=DB.Carriers.find(x=>x.id===$('#l-carrierId').value);$('#l-pct').value=c?c.commission:CFG.pct}
function saveLoad(){
  const r={id:eid||uid('l_')};LF.forEach(k=>r[k]=$('#l-'+k).value);
  if(!r.carrierId||!r.booked||r.rate==='')return alert('Carrier, booking time and rate are required.');
  r.rate=+r.rate;r.pct=+r.pct||0;r.dispatcher=(DB.Carriers.find(c=>c.id===r.carrierId)||{}).dispatcher||'';
  upsert('Loads',r);dlg.close()}

/* ---------- invoice ---------- */
function invLoads(){
  const id=$('#ic').value,f=$('#if').value,t=$('#it').value;
  const ls=DB.Loads.filter(l=>l.carrierId===id&&live(l)&&(!f||l.booked.slice(0,10)>=f)&&(!t||l.booked.slice(0,10)<=t));
  $('#iloads').innerHTML=ls.length?'<table><tr><th></th><th>Booked</th><th>Route</th><th>Status</th><th class="r">Rate</th></tr>'+ls.map(l=>
   `<tr><td><input type="checkbox" class="ick" value="${l.id}" ${l.status==='Delivered'?'checked':''} style="width:auto"></td><td>${l.booked.replace('T',' ')}</td><td>${esc(l.origin)} → ${esc(l.dest)}</td><td>${l.status}</td><td class="r">${$$(l.rate)}</td></tr>`).join('')+'</table>':'<p>No loads in range.</p>';
}
function genInvoice(){
  const ids=[...document.querySelectorAll('.ick:checked')].map(e=>e.value),ls=DB.Loads.filter(l=>ids.includes(l.id)),
    c=DB.Carriers.find(x=>x.id===$('#ic').value);
  if(!c||!ls.length)return alert('Select a carrier and at least one load.');
  const s=stats(ls),no='INV-'+new Date().toISOString().slice(2,10).replace(/-/g,'')+'-'+String(c.mc).replace(/\W/g,'').slice(-4);
  const pcts=[...new Set(ls.map(l=>l.pct))],eff=pcts.length===1?pcts[0]+'%':'mixed';
  $('#inv').hidden=false;$('#inv').innerHTML=`
  <div class="top"><div><h3>${esc(CFG.name)}</h3><div style="color:var(--mut)">${esc(CFG.addr||'')}</div></div>
   <div style="text-align:right"><h3>INVOICE</h3>${no}<br>Date: ${new Date().toLocaleDateString()}</div></div>
  <p><b>Bill to:</b><br>${esc(c.company)}<br>${esc(c.owner)} · ${esc(c.phone)}<br>MC/MX: ${esc(c.mc)}</p>
  <div class="tw"><table><tr><th>Booked</th><th>Route</th><th class="r">Rate con</th><th class="r">Fee %</th><th class="r">Fee</th></tr>${ls.map(l=>
   `<tr><td>${l.booked.replace('T',' ')}</td><td>${esc(l.origin)} → ${esc(l.dest)}</td><td class="r">${$$(l.rate)}</td><td class="r">${l.pct}%</td><td class="r">${$$(fee(l))}</td></tr>`).join('')}</table></div>
  <div class="tot"><div><span>Total gross (${ls.length} loads)</span><span>${$$(s.gross)}</span></div>
   <div><span>Dispatch fee (${eff})</span><span>${$$(s.fee)}</span></div>
   <div class="due"><span>Net amount due</span><span>${$$(s.fee)}</span></div></div>
  <p style="color:var(--mut);margin-top:24px">${esc(CFG.pay||'')}<br>Thank you for your business.</p>`;
  $('#inv').scrollIntoView({behavior:'smooth'});
}
['ic','if','it'].forEach(i=>$('#'+i).addEventListener('change',invLoads));

/* ---------- settings, tabs, boot ---------- */
const SET={name:'s-name',addr:'s-addr',pay:'s-pay',disp:'s-disp',pct:'s-pct',url:'s-url',token:'s-tok'};
function saveCfg(){for(const k in SET)CFG[k]=$('#'+SET[k]).value.trim();CFG.pct=+CFG.pct||0;st('dl_cfg',CFG);
  if(CFG.url){pull().then(()=>{if(!DB.Carriers.length&&!DB.Loads.length)return;})}render();alert('Saved.')}
const TABS=[['dash','Dashboard'],['car','Carriers'],['load','Loads'],['inv','Invoices'],['set','Settings']];
$('#nav').innerHTML=TABS.map(([k,n])=>`<button data-t="${k}">${n}</button>`).join('');
$('#nav').onclick=e=>{const k=e.target.dataset.t;if(!k)return;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.id==='t-'+k));
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===k));if(k==='inv')invLoads()};
document.querySelector('nav button').classList.add('on');
$('#cq').oninput=renderCarriers;
for(const k in SET)$('#'+SET[k]).value=CFG[k]??'';
const dc=$('#dc'),dlg=$('#dlg');
render();pull();setInterval(pull,30000);
</script></body></html>
