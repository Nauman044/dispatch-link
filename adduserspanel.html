<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dispatch Link | Admin & Client Management Suite</title>
    <link rel="icon" type="image/png" href="https://cdn.jsdelivr.net/gh/mrartist048/fmcsa-control@main/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ea580c; /* Vivid Orange */
            --primary-hover: #c2410c;
            --dark-bg: #0b0f19;
            --card-bg: #111827;
            --border-color: #1f2937;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --whatsapp: #25d366;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--dark-bg);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 20px 10px 50px 10px;
            box-sizing: border-box;
        }

        .admin-wrapper {
            width: 100%;
            max-width: 680px;
        }

        .admin-card {
            background: var(--card-bg);
            padding: 25px 20px;
            border-radius: 16px;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7);
            border: 1px solid var(--border-color);
            box-sizing: border-box;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 14px;
        }

        .panel-title-area h2 {
            color: var(--text-main);
            margin: 0 0 4px 0;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .panel-title-area p {
            color: var(--text-muted);
            margin: 0;
            font-size: 12px;
        }

        .tab-buttons {
            display: flex;
            gap: 6px;
            background: #1f2937;
            padding: 4px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            background: transparent;
            border: none;
            padding: 8px 12px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            color: var(--text-muted);
            flex: 1;
            text-align: center;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background: var(--primary);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(234, 88, 12, 0.3);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .form-group {
            margin-bottom: 14px;
            text-align: left;
        }

        .form-group.full-width {
            grid-column: span 2;
        }

        label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        input, select {
            width: 100%;
            padding: 10px 12px;
            font-size: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            outline: none;
            box-sizing: border-box;
            background: #1f2937;
            color: var(--text-main);
            transition: all 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(234, 88, 12, 0.2);
        }

        .search-box {
            display: flex;
            gap: 8px;
        }

        .search-btn {
            background: #1f2937;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 0 14px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .search-btn:hover {
            background: #374151;
            border-color: var(--primary);
            color: var(--primary);
        }

        .submit-btn {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 4px;
            box-shadow: 0 4px 15px rgba(234, 88, 12, 0.3);
        }

        .submit-btn:hover {
            background: var(--primary-hover);
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-bottom: 14px;
        }

        .stat-card {
            background: #1f2937;
            border: 1px solid var(--border-color);
            padding: 8px 4px;
            border-radius: 8px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 3px;
            height: 100%;
        }

        .stat-card.total-box::before { background: var(--primary); }
        .stat-card.active-box::before { background: var(--success); }
        .stat-card.near-box::before { background: var(--warning); }
        .stat-card.expired-box::before { background: var(--danger); }

        .stat-val {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-main);
            margin-top: 2px;
        }

        .stat-lbl {
            font-size: 9px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .filter-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            gap: 6px;
        }

        .filter-pills {
            display: flex;
            gap: 4px;
            overflow-x: auto;
            width: 100%;
            padding-bottom: 4px;
        }

        .pill-btn {
            background: #1f2937;
            border: 1px solid var(--border-color);
            padding: 5px 10px;
            font-size: 10px;
            font-weight: 600;
            border-radius: 16px;
            cursor: pointer;
            color: var(--text-muted);
            white-space: nowrap;
            transition: all 0.2s;
        }

        .pill-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .table-container {
            width: 100%;
            overflow-x: auto;
            max-height: 320px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            background: #111827;
            margin-bottom: 20px;
        }

        .user-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 11px;
            min-width: 550px;
        }

        .user-table th, .user-table td {
            padding: 9px 10px;
            border-bottom: 1px solid var(--border-color);
            text-align: left;
            white-space: nowrap;
        }

        .user-table th {
            background: #1f2937;
            color: var(--text-main);
            font-weight: 600;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .user-table tr:hover td {
            background: rgba(31, 41, 55, 0.5);
        }

        .action-btn-group {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .action-edit-btn {
            background: rgba(234, 88, 12, 0.15);
            color: #fb923c;
            border: 1px solid rgba(234, 88, 12, 0.3);
            padding: 4px 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            transition: background 0.2s;
        }
        .action-edit-btn:hover { background: rgba(234, 88, 12, 0.3); }

        .action-wa-btn {
            background: rgba(37, 211, 102, 0.15);
            color: #25d366;
            border: 1px solid rgba(37, 211, 102, 0.3);
            padding: 4px 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            transition: background 0.2s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 3px;
        }
        .action-wa-btn:hover { background: rgba(37, 211, 102, 0.3); }

        .action-del-btn {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 4px 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            transition: background 0.2s;
        }
        .action-del-btn:hover { background: rgba(239, 68, 68, 0.3); }
        
        .badge-active { background: rgba(16, 185, 129, 0.15); color: #34d399; padding: 2px 6px; border-radius: 4px; font-size: 9px; font-weight: 600; display: inline-block; border: 1px solid rgba(16, 185, 129, 0.3); }
        .badge-near { background: rgba(245, 158, 11, 0.15); color: #fbbf24; padding: 2px 6px; border-radius: 4px; font-size: 9px; font-weight: 600; display: inline-block; border: 1px solid rgba(245, 158, 11, 0.3); }
        .badge-expired { background: rgba(239, 68, 68, 0.15); color: #f87171; padding: 2px 6px; border-radius: 4px; font-size: 9px; font-weight: 600; display: inline-block; border: 1px solid rgba(239, 68, 68, 0.3); }

        @media(max-width: 600px) {
            body { padding: 8px 4px 40px 4px; }
            .admin-card { padding: 16px 12px; border-radius: 10px; }
            .form-grid { display: flex; flex-direction: column; gap: 0; }
        }
    </style>
</head>
<body>

    <div class="admin-wrapper">
        <div class="admin-card">
            
            <div class="panel-header">
                <div class="panel-title-area">
                    <h2>🔥 Dispatch Link Control Center</h2>
                    <p>Manage enterprise clients, licenses and WhatsApp templates securely.</p>
                </div>
            </div>

            <div class="tab-buttons">
                <button class="tab-btn active" id="tabAddBtn" onclick="switchTab('add')">🛠️ Add / Edit</button>
                <button class="tab-btn" id="tabListBtn" onclick="switchTab('list')">👥 Directory</button>
            </div>

            <!-- TAB 1: ADD / UPDATE USER -->
            <div id="sectionAddUser">
                <div class="form-group full-width">
                    <label>Target Firebase Database:</label>
                    <select id="dbUrlSelect">
                        <option value="https://data-scrapper-eddcf-default-rtdb.firebaseio.com/">Database 1 (Default)</option>
                        <option value="https://data-scraper-2-default-rtdb.firebaseio.com/">Database 2 (Secondary)</option>
                        <option value="https://data-scraper-3-default-rtdb.firebaseio.com/">Database 3 (Enterprise)</option>
                    </select>
                </div>

                <div class="form-grid">
                    <div class="form-group full-width">
                        <label>Username (Login ID):</label>
                        <div class="search-box">
                            <input type="text" id="newUsername" placeholder="e.g. swiftlogistics">
                            <button onclick="searchExistingUser()" class="search-btn">🔍 Search</button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Company Name:</label>
                        <input type="text" id="newCompanyName" placeholder="Company Name">
                    </div>

                    <div class="form-group">
                        <label>Owner Name:</label>
                        <input type="text" id="newOwnerName" placeholder="Owner Name">
                    </div>

                    <div class="form-group">
                        <label>Phone Number:</label>
                        <input type="text" id="newNumber" placeholder="3337444558">
                    </div>

                    <div class="form-group">
                        <label>Email Address:</label>
                        <input type="email" id="newEmail" placeholder="client@email.com">
                    </div>

                    <div class="form-group">
                        <label>Secure Password:</label>
                        <input type="text" id="newPassword" placeholder="Password">
                    </div>

                    <div class="form-group">
                        <label>Total Screens (Max Tabs):</label>
                        <input type="number" id="newMaxLaptops" value="1" min="1">
                    </div>

                    <div class="form-group">
                        <label>First Joining Date:</label>
                        <input type="date" id="newJoiningDate">
                    </div>

                    <div class="form-group">
                        <label>Package Expiry Date:</label>
                        <input type="date" id="newExpiresDate">
                    </div>

                    <div class="form-group full-width">
                        <label>Total Payment:</label>
                        <input type="text" id="newTotalPayment" placeholder="e.g. Rs4,000 / Free / Trial">
                    </div>
                </div>

                <button onclick="saveOrUpdateUserToFirebase()" class="submit-btn">Save / Update License & Sheet Record</button>
            </div>

            <!-- TAB 2: ALL USERS LIST -->
            <div id="sectionAllUsers" style="display: none;">
                
                <div style="display: flex; gap: 6px; align-items: flex-end; margin-bottom: 12px;">
                    <div class="form-group" style="flex: 1; margin-bottom: 0;">
                        <label>Select Database Node:</label>
                        <select id="viewDbDropdown" onchange="applyTableFilters()">
                            <option value="All">🌐 All Databases</option>
                            <option value="Database 1">Database 1</option>
                            <option value="Database 2">Database 2</option>
                            <option value="Database 3">Database 3</option>
                        </select>
                    </div>
                    <button onclick="fetchAllUsersFromAllDBs()" class="search-btn" style="height: 38px; margin-bottom: 0;" title="Sync Data">🔄 Sync</button>
                </div>

                <div class="stats-row">
                    <div class="stat-card total-box">
                        <div class="stat-lbl">Total</div>
                        <div class="stat-val" id="statTotal">0</div>
                    </div>
                    <div class="stat-card active-box">
                        <div class="stat-lbl">Active</div>
                        <div class="stat-val" id="statActive" style="color: var(--success);">0</div>
                    </div>
                    <div class="stat-card near-box">
                        <div class="stat-lbl">Near Exp</div>
                        <div class="stat-val" id="statNear" style="color: var(--warning);">0</div>
                    </div>
                    <div class="stat-card expired-box">
                        <div class="stat-lbl">Expired</div>
                        <div class="stat-val" id="statExpired" style="color: var(--danger);">0</div>
                    </div>
                </div>

                <div class="filter-container">
                    <div class="filter-pills">
                        <button class="pill-btn active" id="pillAll" onclick="setFilter('all')">All</button>
                        <button class="pill-btn" id="pillActive" onclick="setFilter('active')">Active</button>
                        <button class="pill-btn" id="pillNear" onclick="setFilter('near')">⚠️ Near Exp</button>
                        <button class="pill-btn" id="pillExpired" onclick="setFilter('expired')">Expired</button>
                    </div>
                </div>

                <div class="form-group" style="margin-bottom: 10px;">
                    <input type="text" id="tableSearchInput" placeholder="🔍 Quick search username..." oninput="applyTableFilters()">
                </div>

                <div class="table-container">
                    <table class="user-table">
                        <thead>
                            <tr>
                                <th>User & Limits</th>
                                <th>Password</th>
                                <th>Node</th>
                                <th>Expiry</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="allUsersTableBody">
                            <tr><td colspan="6" style="text-align: center; color: var(--text-muted); padding: 15px;">Fetching data...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const DB_CONFIGS = [
            { name: "Database 1", url: "https://data-scrapper-eddcf-default-rtdb.firebaseio.com/" },
            { name: "Database 2", url: "https://data-scraper-2-default-rtdb.firebaseio.com/" },
            { name: "Database 3", url: "https://data-scraper-3-default-rtdb.firebaseio.com/" }
        ];

        const GOOGLE_SHEET_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwjQkzpNQ8asIPAf4eZgwnA8TpycnAZ2ISVdyw513LFUkAdrcSidi--kjGcm1EdULOF/exec";

        let globalUsersCache = [];
        let currentStatusFilter = 'all';

        function switchTab(tabName) {
            let addSec = document.getElementById('sectionAddUser');
            let listSec = document.getElementById('sectionAllUsers');
            let addBtn = document.getElementById('tabAddBtn');
            let listBtn = document.getElementById('tabListBtn');

            if (tabName === 'add') {
                addSec.style.display = 'block';
                listSec.style.display = 'none';
                addBtn.classList.add('active');
                listBtn.classList.remove('active');
            } else {
                addSec.style.display = 'none';
                listSec.style.display = 'block';
                listBtn.classList.add('active');
                addBtn.classList.remove('active');
                fetchAllUsersFromAllDBs();
            }
        }

        async function searchExistingUser() {
            let dbUrl = document.getElementById('dbUrlSelect').value;
            let username = document.getElementById('newUsername').value.trim();

            if (!username) { alert("Please enter a username to search."); return; }

            try {
                let res = await fetch(`${dbUrl}allowedUsers/${username}.json`);
                let userData = await res.json();

                if (userData) {
                    document.getElementById('newPassword').value = userData.pass || '';
                    document.getElementById('newMaxLaptops').value = userData.maxLaptops || 1;
                    document.getElementById('newExpiresDate').value = userData.expires || '';
                    document.getElementById('newNumber').value = userData.number || '';
                    alert("User record located successfully in Firebase!");
                } else {
                    alert("User not found in this cluster node.");
                }
            } catch (error) {
                console.error("Search error:", error);
                alert("Connection error while querying.");
            }
        }

        async function saveOrUpdateUserToFirebase() {
            let dbUrl = document.getElementById('dbUrlSelect').value;
            let username = document.getElementById('newUsername').value.trim();
            let companyName = document.getElementById('newCompanyName').value.trim();
            let ownerName = document.getElementById('newOwnerName').value.trim();
            let number = document.getElementById('newNumber').value.trim();
            let email = document.getElementById('newEmail').value.trim();
            let password = document.getElementById('newPassword').value.trim();
            let maxLaptops = parseInt(document.getElementById('newMaxLaptops').value) || 1;
            let joiningDate = document.getElementById('newJoiningDate').value;
            let expires = document.getElementById('newExpiresDate').value;
            let totalPayment = document.getElementById('newTotalPayment').value.trim();

            if (!username || !password || !expires) {
                alert("Please complete required fields (Username, Password, Expiry Date)!");
                return;
            }

            try {
                let checkRes = await fetch(`${dbUrl}allowedUsers/${username}.json`);
                let existingUser = await checkRes.json();
                let isAlreadyExists = (existingUser !== null);

                // FIREBASE DATA (Without Owner Name, Company Name, or Email)
                let firebaseData = {
                    pass: password,
                    maxLaptops: maxLaptops,
                    expires: expires,
                    number: number
                };

                // GOOGLE SHEET DATA (Full Data)
                let sheetData = {
                    username: username,
                    joiningDate: joiningDate,
                    ownerName: ownerName,
                    number: number,
                    companyName: companyName,
                    email: email,
                    password: password,
                    maxTabs: maxLaptops,
                    expiryDate: expires,
                    totalPayment: totalPayment
                };

                let fbResponse = await fetch(`${dbUrl}allowedUsers/${username}.json`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(firebaseData)
                });

                if (!fbResponse.ok) {
                    alert("Failed to write to Firebase node.");
                    return;
                }

                if (GOOGLE_SHEET_WEB_APP_URL) {
                    fetch(GOOGLE_SHEET_WEB_APP_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(sheetData)
                    }).catch(err => console.log("Sheet sync error:", err));
                }

                if (isAlreadyExists) {
                    alert(`Warning: User "${username}" already existed! The record has been successfully updated.`);
                } else {
                    alert(`Success: New user "${username}" has been successfully saved!`);
                }

                if (number && confirm(`Do you want to send WhatsApp credentials message to ${number}?`)) {
                    sendWhatsAppCredentials(username, password, number);
                }

            } catch (error) {
                console.error("Network/CORS error:", error);
                alert("Connection failure during save operation.");
            }
        }

        async function fetchAllUsersFromAllDBs() {
            let tbody = document.getElementById('allUsersTableBody');
            tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: var(--text-muted); padding: 15px;">Synchronizing clusters and pulling numbers...</td></tr>`;

            globalUsersCache = [];
            
            let today = new Date();
            today.setHours(0, 0, 0, 0);

            for (let dbObj of DB_CONFIGS) {
                try {
                    let controller = new AbortController();
                    let timeoutId = setTimeout(() => controller.abort(), 5000);

                    let res = await fetch(`${dbObj.url}allowedUsers.json`, { signal: controller.signal });
                    clearTimeout(timeoutId);

                    if (!res.ok) continue;
                    let usersData = await res.json() || {};

                    for (let username in usersData) {
                        let u = usersData[username];
                        let expDateStr = u.expires || '';
                        let isExpired = false;
                        let isNearExpire = false;

                        if (expDateStr !== '') {
                            let expDateObj = new Date(expDateStr);
                            expDateObj.setHours(0, 0, 0, 0);

                            let diffTime = expDateObj - today;
                            let diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

                            if (diffDays < 0) {
                                isExpired = true;
                            } else if (diffDays <= 2) {
                                isNearExpire = true;
                            }
                        }

                        globalUsersCache.push({
                            username: username,
                            dbName: dbObj.name,
                            dbUrl: dbObj.url,
                            pass: u.pass || '',
                            maxLaptops: u.maxLaptops || 1,
                            expires: expDateStr || 'N/A',
                            number: u.number || '',
                            isExpired: isExpired,
                            isNearExpire: isNearExpire
                        });
                    }
                } catch (e) {
                    console.error(`Failed cluster fetch ${dbObj.name}:`, e);
                }
            }

            applyTableFilters();
        }

        function updateDashboardStats(filteredUsers) {
            let total = filteredUsers.length;
            let expired = filteredUsers.filter(u => u.isExpired).length;
            let near = filteredUsers.filter(u => u.isNearExpire).length;
            let active = total - expired - near;

            document.getElementById('statTotal').innerText = total;
            document.getElementById('statActive').innerText = active;
            document.getElementById('statNear').innerText = near;
            document.getElementById('statExpired').innerText = expired;
        }

        function setFilter(status) {
            currentStatusFilter = status;
            document.querySelectorAll('.pill-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('pill' + status.charAt(0).toUpperCase() + status.slice(1)).classList.add('active');
            applyTableFilters();
        }

        function applyTableFilters() {
            let selectedDb = document.getElementById('viewDbDropdown').value;
            let query = document.getElementById('tableSearchInput').value.toLowerCase().trim();

            let dbFiltered = (selectedDb === 'All') 
                ? globalUsersCache 
                : globalUsersCache.filter(u => u.dbName === selectedDb);

            let finalFiltered = dbFiltered.filter(u => {
                let matchesSearch = u.username.toLowerCase().includes(query);
                let matchesStatus = true;
                if (currentStatusFilter === 'active') matchesStatus = (!u.isExpired && !u.isNearExpire);
                if (currentStatusFilter === 'near') matchesStatus = u.isNearExpire;
                if (currentStatusFilter === 'expired') matchesStatus = u.isExpired;
                return matchesSearch && matchesStatus;
            });

            updateDashboardStats(dbFiltered);
            renderUserTable(finalFiltered, selectedDb);
        }

        // PERFECT NUMBER FORMATTER (Removes leading 0 and prefixes 92)
        function formatPhoneNumber(number) {
            if (!number) return '';
            let cleaned = String(number).replace(/[^0-9]/g, '');
            if (cleaned.startsWith('0')) {
                cleaned = '92' + cleaned.substring(1);
            } else if (cleaned.length === 10) {
                cleaned = '92' + cleaned;
            }
            return cleaned;
        }

        // 100% SECURE LOOKUP HELPER TO GET NUMBER FROM CACHE BY USERNAME
        function getUserNumber(username) {
            let found = globalUsersCache.find(u => u.username === username);
            return found ? found.number : '';
        }

        // WHATSAPP LOGIN INFO TEMPLATE
        function sendWhatsAppCredentials(username, password, rawNumber) {
            let number = rawNumber || getUserNumber(username);
            let message = `Hello! Your Dispatch Link account details:\n\n` +
                          `👤 Username: *${username}*\n` +
                          `🔑 Password: *${password}*\n\n` +
                          `📌 Follow these steps to login:\n` +
                          `1. First, download and install the *Allow CORS* extension.\n` +
                          `2. Turn ON the Allow CORS extension.\n` +
                          `3. Connect your *VPN* securely.\n` +
                          `4. Finally, visit website: *dispatchlink.online* and login using your username & password.`;

            let encodedMessage = encodeURIComponent(message);
            let phoneParam = formatPhoneNumber(number);

            let whatsappUrl = `https://wa.me/${phoneParam}?text=${encodedMessage}`;
            window.open(whatsappUrl, '_blank');
        }

        // WHATSAPP PACKAGE EXPIRY / RENEWAL ALERT
        function sendWhatsAppRenewalAlert(username, expiryDate, rawNumber) {
            let number = rawNumber || getUserNumber(username);
            let message = `Hello *${username}*, your Dispatch Link package has expired on *${expiryDate}*. Please contact support to upgrade your package and keep your shift active.`;
            let encodedMessage = encodeURIComponent(message);
            let phoneParam = formatPhoneNumber(number);

            let whatsappUrl = `https://wa.me/${phoneParam}?text=${encodedMessage}`;
            window.open(whatsappUrl, '_blank');
        }

        function renderUserTable(users, dbName) {
            let tbody = document.getElementById('allUsersTableBody');
            let displayName = (dbName === 'All') ? 'All Databases' : dbName;
            
            if (users.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: var(--danger); padding: 15px;">No records found in ${displayName}.</td></tr>`;
                return;
            }

            let allRows = "";
            users.forEach(u => {
                let safeUser = encodeURIComponent(u.username);
                let safeUrl = encodeURIComponent(u.dbUrl);
                let safePass = encodeURIComponent(u.pass);
                let safeExpiry = encodeURIComponent(u.expires);

                let statusBadge = `<span class="badge-active">Active</span>`;
                if (u.isExpired) {
                    statusBadge = `<span class="badge-expired">Expired</span>`;
                } else if (u.isNearExpire) {
                    statusBadge = `<span class="badge-near">Near Exp</span>`;
                }

                let waButtonHtml = '';
                if (u.isExpired) {
                    waButtonHtml = `<button onclick="sendWhatsAppRenewalAlert('${u.username}', '${u.expires}', '${u.number}')" class="action-wa-btn" title="Send Expiry/Upgrade Alert">⚠️ Renew</button>`;
                } else {
                    waButtonHtml = `<button onclick="sendWhatsAppCredentials('${u.username}', '${u.pass}', '${u.number}')" class="action-wa-btn" title="Send Login Details">💬 Info</button>`;
                }

                allRows += `
                    <tr>
                        <td><b>${u.username}</b><br><span style="font-size:9px; color:var(--text-muted);">Tabs: ${u.maxLaptops} | Ph: ${u.number || 'No Phone'}</span></td>
                        <td><code style="background:#1f2937; padding:2px 6px; border-radius:4px; color:#fb923c; font-family:monospace; border:1px solid #374151;">${u.pass || 'N/A'}</code></td>
                        <td><span style="font-size:9px; background:#1f2937; color:#d1d5db; padding:2px 6px; border-radius:4px; font-weight:600; border: 1px solid #374151;">${u.dbName}</span></td>
                        <td>${u.expires}</td>
                        <td>${statusBadge}</td>
                        <td>
                            <div class="action-btn-group">
                                ${waButtonHtml}
                                <button onclick="editUserFromList('${safeUser}', '${safeUrl}', '${safePass}', '${u.maxLaptops}', '${safeExpiry}')" class="action-edit-btn">✏️ Edit</button>
                                <button onclick="deleteUser('${u.dbUrl}', '${u.username}')" class="action-del-btn">🗑️</button>
                            </div>
                        </td>
                    </tr>
                `;
            });
            tbody.innerHTML = allRows;
        }

        function editUserFromList(username, dbUrl, pass, maxLaptops, expires) {
            switchTab('add');
            document.getElementById('dbUrlSelect').value = decodeURIComponent(dbUrl);
            document.getElementById('newUsername').value = decodeURIComponent(username);
            document.getElementById('newPassword').value = decodeURIComponent(pass);
            document.getElementById('newMaxLaptops').value = maxLaptops;
            document.getElementById('newExpiresDate').value = decodeURIComponent(expires);
        }

        async function deleteUser(dbUrl, username) {
            if (confirm(`Permanently delete user cluster record for "${username}"?`)) {
                try {
                    let deleteRes = await fetch(`${dbUrl}allowedUsers/${username}.json`, { method: 'DELETE' });
                    if (deleteRes.ok) {
                        alert("Record successfully deleted.");
                        fetchAllUsersFromAllDBs();
                    } else {
                        alert("Deletion failed.");
                    }
                } catch (e) {
                    console.error("Delete error:", e);
                    alert("Connection error during removal.");
                }
            }
        }
    </script>
</body>
</html>
