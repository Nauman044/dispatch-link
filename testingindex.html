<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dispatch Link | Enterprise Admin Dashboard</title>
    <!-- Favicon Integration -->
    <link rel="icon" type="image/png" href="https://cdn.jsdelivr.net/gh/mrartist048/fmcsa-control@main/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Flatpickr CSS for Modern Single Calendar Range Picker -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <style>
        :root {
            --primary: #0284c7;
            --primary-dark: #0369a1;
            --slate-900: #0f172a;
            --slate-800: #1e293b;
            --slate-700: #334155;
            --slate-600: #475569;
            --slate-500: #64748b;
            --slate-200: #e2e8f0;
            --slate-100: #f1f5f9;
            --slate-50: #f8fafc;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { box-sizing: border-box; }
        
        body { 
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; 
            background-color: var(--slate-100); 
            color: var(--slate-900); 
            margin: 0; 
            padding: 0; 
            height: 100vh; 
            overflow: hidden; 
            -webkit-font-smoothing: antialiased;
        }
        
        /* AUTHENTICATION OVERLAY MODAL DESIGN */
        #authOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .auth-card {
            background: #ffffff;
            padding: 40px 36px;
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 420px;
            box-shadow: var(--shadow-lg);
            text-align: center;
            border: 1px solid var(--slate-200);
            animation: modalFadeIn 0.3s ease-out;
        }
        @keyframes modalFadeIn {
            from { opacity: 0; transform: translateY(10px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .auth-icon {
            font-size: 32px;
            margin-bottom: 20px;
            background: linear-gradient(135sdeg, #f0fdf4, #dcfce7);
            width: 72px;
            height: 72px;
            line-height: 72px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #bbf7d0;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }
        .auth-card h2 {
            margin: 0 0 8px 0;
            font-size: 22px;
            font-weight: 800;
            color: var(--slate-900);
            letter-spacing: -0.5px;
        }
        .auth-card p {
            margin: 0 0 28px 0;
            font-size: 13.5px;
            color: var(--slate-500);
            line-height: 1.6;
        }
        .auth-input {
            width: 100%;
            padding: 13px 16px;
            font-size: 14px;
            border: 1.5px solid var(--slate-200);
            border-radius: var(--radius-sm);
            outline: none;
            transition: var(--transition);
            font-weight: 500;
            background: var(--slate-50);
            color: var(--slate-900);
            margin-bottom: 14px;
        }
        .auth-input:focus {
            border-color: var(--primary);
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.12);
        }
        
        /* PASSWORD FIELD WRAPPER WITH EYE ICON */
        .password-container {
            position: relative;
            width: 100%;
            margin-bottom: 16px;
        }
        .password-container .auth-input {
            margin-bottom: 0;
            padding-right: 48px;
        }
        .eye-btn {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            color: var(--slate-400, #94a3b8);
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            transition: var(--transition);
        }
        .eye-btn:hover {
            color: var(--slate-900);
            background: var(--slate-100);
        }

        .auth-btn {
            width: 100%;
            background: var(--slate-900);
            color: white;
            border: none;
            padding: 13px;
            font-size: 14px;
            font-weight: 700;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: var(--transition);
            box-shadow: var(--shadow-sm);
        }
        .auth-btn:hover {
            background: var(--slate-800);
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }
        .auth-error {
            color: var(--danger);
            font-size: 12.5px;
            margin-top: 12px;
            font-weight: 600;
            display: none;
        }

        .admin-layout { display: flex; height: 100vh; width: 100vw; overflow: hidden; position: relative; }
        
        /* SIDEBAR NAVIGATION */
        .sidebar { 
            width: 280px; 
            background: var(--slate-900); 
            color: white; 
            display: flex; 
            flex-direction: column; 
            flex-shrink: 0; 
            box-shadow: 4px 0 25px rgba(0,0,0,0.12); 
            z-index: 100; 
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        .sidebar-brand { 
            padding: 28px 24px; 
            border-bottom: 1px solid rgba(255,255,255,0.06); 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
        }
        .sidebar-brand h2 { margin: 0; font-size: 18px; font-weight: 800; color: #ffffff; letter-spacing: -0.4px; }
        .sidebar-brand span { font-size: 11px; color: #38bdf8; font-weight: 700; display: block; margin-top: 3px; letter-spacing: 0.5px; text-transform: uppercase; }
        
        .sidebar-menu { padding: 24px 16px; display: flex; flex-direction: column; gap: 6px; flex: 1; overflow-y: auto; }
        .menu-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 1px; color: var(--slate-500); padding: 0 12px 8px 12px; font-weight: 800; }
        
        .nav-btn { 
            background: transparent; 
            color: #94a3b8; 
            border: none; 
            padding: 12px 16px; 
            text-align: left; 
            font-size: 13.5px; 
            font-weight: 600; 
            border-radius: var(--radius-sm); 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            transition: var(--transition); 
            width: 100%; 
        }
        .nav-btn:hover { background: rgba(255,255,255,0.05); color: #f8fafc; }
        .nav-btn.active { 
            background: linear-gradient(135deg, var(--primary), var(--primary-dark)); 
            color: white; 
            box-shadow: 0 4px 14px rgba(2,132,199,0.4); 
            font-weight: 700;
        }

        /* MAIN CONTENT AREA */
        .main-wrapper { flex: 1; display: flex; flex-direction: column; background: var(--slate-50); overflow: hidden; width: 100%; }
        
        /* TOP BAR & FILTERS */
        .top-header { 
            height: auto; 
            min-height: 76px; 
            background: white; 
            border-bottom: 1px solid var(--slate-200); 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding: 16px 28px; 
            box-shadow: var(--shadow-sm); 
            flex-shrink: 0; 
            gap: 16px; 
            flex-wrap: wrap; 
        }
        .header-title-wrapper { display: flex; align-items: center; gap: 14px; }
        .header-title { font-size: 20px; font-weight: 800; color: var(--slate-900); letter-spacing: -0.4px; word-break: break-word; }
        
        .menu-toggle { display: none; background: transparent; border: none; font-size: 22px; cursor: pointer; color: var(--slate-900); padding: 4px; flex-shrink: 0; }
        .header-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

        .filter-bar { 
            background: white; 
            padding: 14px 28px; 
            border-bottom: 1px solid var(--slate-200); 
            display: flex; 
            flex-wrap: wrap; 
            align-items: center; 
            justify-content: space-between; 
            gap: 12px; 
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.01); 
            flex-shrink: 0; 
        }
        .filter-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        
        /* Filter Button Styling with Active Color Transition */
        .filter-btn { 
            background: var(--slate-100); 
            color: var(--slate-600); 
            border: 1px solid var(--slate-200); 
            padding: 7px 14px; 
            font-size: 12.5px; 
            font-weight: 600; 
            border-radius: var(--radius-sm); 
            cursor: pointer; 
            transition: var(--transition); 
            white-space: nowrap; 
        }
        .filter-btn:hover { background: var(--slate-200); color: var(--slate-900); }
        .filter-btn.active { 
            background: var(--primary) !important; 
            color: white !important; 
            border-color: var(--primary) !important; 
            box-shadow: 0 2px 8px rgba(2, 132, 199, 0.35); 
            font-weight: 700;
        }

        /* SINGLE MODERN CALENDAR INPUT STYLING */
        .single-range-input { 
            padding: 7px 14px; 
            font-size: 12.5px; 
            border: 1px solid var(--slate-200); 
            border-radius: var(--radius-sm); 
            outline: none; 
            font-weight: 600; 
            color: var(--slate-900); 
            background: #fff; 
            cursor: pointer; 
            width: 220px; 
            text-align: center; 
            transition: var(--transition);
        }
        .single-range-input:hover, .single-range-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.1);
        }

        .admin-body { flex: 1; padding: 28px; overflow-y: auto; background: var(--slate-50); }
        
        /* MODERN CARD UI */
        .card { 
            background: white; 
            border: 1px solid var(--slate-200); 
            padding: 22px 26px; 
            border-radius: var(--radius-md); 
            margin-bottom: 16px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            box-shadow: var(--shadow-sm); 
            transition: var(--transition); 
        }
        .card:hover { 
            transform: translateY(-2px); 
            box-shadow: var(--shadow-md); 
            border-color: #cbd5e1;
        }
        
        .badge { 
            padding: 5px 12px; 
            border-radius: 20px; 
            font-size: 11px; 
            font-weight: 700; 
            display: inline-flex; 
            align-items: center; 
            gap: 5px; 
            letter-spacing: 0.3px;
        }
        .badge-online { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
        .badge-offline { background: var(--slate-100); color: var(--slate-600); border: 1px solid var(--slate-200); }
        
        .btn-success { 
            background: #10b981; 
            color: white; 
            border: none; 
            padding: 9px 16px; 
            font-size: 12.5px; 
            font-weight: 700; 
            border-radius: var(--radius-sm); 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            gap: 6px; 
            transition: var(--transition); 
            white-space: nowrap; 
            box-shadow: 0 2px 4px rgba(16, 185, 129, 0.2);
        }
        .btn-success:hover { background: #059669; transform: translateY(-1px); }

        .btn-info { 
            background: var(--primary); 
            color: white; 
            border: none; 
            padding: 9px 16px; 
            font-size: 12.5px; 
            font-weight: 700; 
            border-radius: var(--radius-sm); 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            gap: 6px; 
            transition: var(--transition); 
            white-space: nowrap; 
            box-shadow: 0 2px 4px rgba(2, 132, 199, 0.2);
        }
        .btn-info:hover { background: var(--primary-dark); transform: translateY(-1px); }

        .btn-danger { 
            background: #fee2e2; 
            color: #dc2626; 
            border: 1px solid #fecaca; 
            padding: 6px 12px; 
            font-size: 11.5px; 
            font-weight: 700; 
            border-radius: 6px; 
            cursor: pointer; 
            display: inline-flex; 
            align-items: center; 
            gap: 4px; 
            transition: var(--transition); 
        }
        .btn-danger:hover { background: #dc2626; color: white; border-color: #dc2626; }

        .btn-refresh-top { 
            background: var(--slate-900); 
            color: white; 
            border: none; 
            padding: 9px 16px; 
            font-size: 12.5px; 
            font-weight: 700; 
            border-radius: var(--radius-sm); 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            gap: 6px; 
            transition: var(--transition); 
            white-space: nowrap; 
            box-shadow: var(--shadow-sm);
        }
        .btn-refresh-top:hover { background: var(--slate-800); transform: translateY(-1px); }

        .stat-chip { 
            background: var(--slate-50); 
            padding: 6px 12px; 
            border-radius: 6px; 
            font-size: 11.5px; 
            font-weight: 700; 
            border: 1px solid var(--slate-200); 
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15, 23, 42, 0.65); backdrop-filter: blur(6px); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
        .modal-content { background: white; padding: 28px 36px; border-radius: var(--radius-lg); width: 90%; max-width: 500px; box-shadow: var(--shadow-lg); border: 1px solid var(--slate-200); animation: modalFadeIn 0.25s ease-out; }
        .sidebar-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.5); z-index: 90; backdrop-filter: blur(3px); }

        @media (max-width: 900px) {
            body { overflow: auto; height: auto; }
            .admin-layout { height: 100vh; overflow: hidden; }
            .sidebar { position: fixed; top: 0; left: -280px; height: 100%; z-index: 100; transition: left 0.3s ease; }
            .sidebar.open { left: 0; }
            .sidebar-overlay.active { display: block; }
            .menu-toggle { display: block; }
            .top-header { padding: 14px 18px; flex-direction: column; align-items: stretch; }
            .header-title-wrapper { width: 100%; justify-content: flex-start; }
            .header-actions { width: 100%; justify-content: space-between; }
            .header-actions button { flex: 1; justify-content: center; font-size: 12px; padding: 8px 10px; }
            .filter-bar { padding: 12px 18px; flex-direction: column; align-items: stretch; gap: 10px; }
            .filter-group { width: 100%; justify-content: flex-start; flex-wrap: wrap; gap: 6px; }
            .filter-group span { width: 100%; margin-bottom: 2px; }
            .single-range-input { width: 100%; }
            .admin-body { padding: 18px; }
            .card { flex-direction: column; align-items: flex-start !important; gap: 12px; width: 100%; }
        }
    </style>
</head>
